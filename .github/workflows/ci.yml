name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter lists the PR's changed files through the API.
  pull-requests: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  clean-room:
    name: Clean-room check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-clean-room.sh

  backend:
    name: Backend (Laravel)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: wegodeliva
          POSTGRES_PASSWORD: wegodeliva
          POSTGRES_DB: wegodeliva_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wegodeliva"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: wegodeliva_test
      DB_USERNAME: wegodeliva
      DB_PASSWORD: wegodeliva
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl, bcmath, mbstring
          coverage: pcov
      - uses: actions/cache@v6
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Tests (Pest)
        run: vendor/bin/pest --coverage --min=80 --coverage-clover build/clover.xml
      - name: Full coverage of money logic
        run: php tools/coverage-gate.php build/clover.xml app/Services/Pricing app/Support/Money.php
      - name: Dependency audit
        run: composer audit

  web:
    name: Web (Next.js)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # ADR 0013: high-severity advisories in shipped (production) dependencies block the merge.
      - name: Dependency audit (production, blocking)
        run: npm audit --omit=dev --audit-level=high
      # Dev tooling (lint, test, build) is reported on every run but does not block: an advisory
      # with no released fix there would otherwise block every web PR.
      - name: Dependency audit (all, report only)
        run: npm audit || echo "::warning title=npm audit (dev tooling)::Advisories in dev dependencies; see this step's log."

  mobile:
    name: Mobile (Flutter)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # Pinned so a new stable release cannot turn CI red overnight (3.48 deprecates
          # package:flutter/material.dart). Bump deliberately, together with any code changes.
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run generate
      - run: melos run analyze
      - run: melos run test
      - run: flutter pub outdated
        working-directory: mobile
