name: wegodeliva_auth
description: "Shared sign-in screens (email + one-time code) for the WeGoDeliva apps."
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  intl: ^0.20.3
  wegodeliva_core:
    path: ../core
  wegodeliva_ui:
    path: ../ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
flutter:
  generate: true
